spring.application.name=demo
server.port=8081
server.servlet.context-path= 

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/homerent_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# FILE UPLOAD
# ===============================
# Maximum size of a single uploaded file (PDF receipts)
spring.servlet.multipart.max-file-size=10MB

# Maximum size of the entire request (same as file size for single uploads)
spring.servlet.multipart.max-request-size=10MB

# Folder where uploaded PDF receipts will be saved on the server
# This folder will be created automatically by our code
app.upload.dir=uploads/receipts